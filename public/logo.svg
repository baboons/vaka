<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vaka">
  <title>Vaka</title>
  <!--
    The app's live-signal indicator, made into a mark: a signal-amber tile
    carrying a dark core inside a broken scanner ring — the same pulse the
    sidebar shows while the watcher is running.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC65B"/>
      <stop offset="0.55" stop-color="#F5A524"/>
      <stop offset="1" stop-color="#E8930C"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <!-- Hairline lift along the top edge, so the tile reads as a lit surface. -->
  <path d="M15 1.5h34" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="1.6" stroke-linecap="round"/>

  <g stroke="#17120A" fill="#17120A">
    <!-- 33/17 dash on a 94.25 circumference gives two arcs with even gaps. -->
    <circle cx="32" cy="32" r="15" fill="none" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="30 17.12"
            transform="rotate(-45 32 32)"/>
    <circle cx="32" cy="32" r="6.75"/>
  </g>
</svg>
